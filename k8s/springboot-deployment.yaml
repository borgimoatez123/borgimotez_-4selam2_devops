apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      containers:
      - name: springboot
        image: borgimoatez123/student-management:latest
        ports:
        - containerPort: 8080
       env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:mysql://mysql-service:3306/studentdb?createDatabaseIfNotExist=true"
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: mysql-secret
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mysql-secret
        key: password
  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
    value: update
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: com.mysql.cj.jdbc.Driver


